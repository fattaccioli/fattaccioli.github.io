<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-name">{{ site.title }}</span>
      <span class="brand-sub">MesoBioLab · CPCV · IPGG</span>
    </a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label="Open menu">
    <label for="nav-toggle" class="nav-burger" aria-hidden="true"><span></span></label>
    <nav class="site-nav" aria-label="Main">
      {%- for path in site.header_pages -%}
        {%- assign p = site.pages | where: "path", path | first -%}
        {%- if p and p.title -%}
        <a href="{{ p.url | relative_url }}"{% if page.url == p.url %} aria-current="page"{% endif %}>{{ p.nav_title | default: p.title }}</a>
        {%- endif -%}
      {%- endfor -%}
    </nav>
  </div>
</header>
